# General information about the application & profile it's running
spring.application.name=bookstore-app
spring.profiles.active=dev
# Tomcat
server.port=8080
server.error.whitelabel.enabled=false
# Communication logging
logging.level.org.zalando.logbook=TRACE
logging.level.org.springframework.r2dbc=DEBUG
# Jackson Serialization / Deserialization options
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_empty
# Database (R2DBC)
spring.r2dbc.url=r2dbc:h2:file:///./db/recruitment_app;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MYSQL
spring.r2dbc.username=${DB_USERNAME:recruitment_app}
spring.r2dbc.password=${DB_PASSWORD:recruitment_app}
spring.r2dbc.pool.initial-size=5
spring.r2dbc.pool.max-size=10
spring.r2dbc.pool.max-idle-time=30m
spring.r2dbc.pool.validation-query=SELECT 1
# JDBC (for Flyway migrations only)
spring.datasource.url=jdbc:h2:file:./db/recruitment_app;MODE=MYSQL
spring.datasource.username=${DB_USERNAME:recruitment_app}
spring.datasource.password=${DB_PASSWORD:recruitment_app}
spring.datasource.driverClassName=org.h2.Driver
# Miscellaneous settings
spring.output.ansi.enabled=ALWAYS
spring.main.banner-mode=off
# Cache props
spring.cache.type=caffeine
# Analyze Performance Metrics
management.endpoints.web.exposure.include=health,info,metrics
## Flyway configuration
spring.flyway.enabled=true
spring.flyway.url=jdbc:h2:file:./db/recruitment_app
spring.flyway.locations=classpath:db/migration
spring.flyway.user=${spring.r2dbc.username}
spring.flyway.password=${spring.r2dbc.password}
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.security=DEBUG
springdoc.swagger-ui.path=/swagger-ui.html

jwt.secret=${JWT_SECRET:xT+G2mBqX9oE3J5UhzR+FowBnCqLc9yRpYowLKH+X7k=}
jwt.expiration.ms=${JWT_EXPIRATION_MS:3600000}
